services:
  mysql:
    image: mysql:8.4
    container_name: mall-mysql
    profiles: ["docker-db"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mall_trade
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=512M

  redis:
    image: redis:7.4
    container_name: mall-redis
    profiles: ["docker-db"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mall-rabbitmq
    profiles: ["docker-mq"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mall
      RABBITMQ_DEFAULT_PASS: mall

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: mall-nacos
    profiles: ["docker-governance"]
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8850:8080"

  sentinel-dashboard:
    build:
      context: ./docker/sentinel-dashboard
    container_name: mall-sentinel-dashboard
    profiles: ["docker-governance"]
    ports:
      - "8858:8858"
