server:
  port: 8080

spring:
  application:
    name: mall-gateway
  config:
    import: classpath:mall-observability.yml
  profiles:
    default: local
  data:
    redis:
      host: localhost
      port: 6379
      password: root
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  cloud:
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      filter:
        enabled: false
      scg:
        order: -150
      log:
        dir: ${SENTINEL_LOG_DIR:logs/sentinel}
        switch-pid: true
    gateway:
      server:
        webflux:
          routes:
            - id: auth-login
              uri: http://localhost:8084
              predicates:
                - Path=/api/auth/login
                - Method=POST
            - id: auth-register
              uri: http://localhost:8084
              predicates:
                - Path=/api/auth/register
                - Method=POST
            - id: user
              uri: http://localhost:8084
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: audit-query
              uri: http://localhost:8084
              predicates:
                - Path=/api/audit/**

            - id: catalog-read
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**,/api/activities/**
                - Method=GET
            - id: product-admin
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**,/api/activities/**,/api/inventories/**
                - Method=GET,POST,PUT,DELETE
            - id: product
              uri: http://localhost:8081
              predicates:
                - Path=/api/products/**,/api/activities/**,/api/inventories/**

            - id: seckill-reserve
              uri: http://localhost:8082
              predicates:
                - Path=/api/seckill/*/reserve
                - Method=POST
            - id: seckill-query
              uri: http://localhost:8082
              predicates:
                - Path=/api/seckill/activities/**
                - Method=GET
            - id: seckill-admin
              uri: http://localhost:8082
              predicates:
                - Path=/api/seckill/activities/**,/api/seckill/stock-deduct-logs/**
            - id: seckill-internal
              uri: http://localhost:8082
              predicates:
                - Path=/internal/seckill/**
            - id: seckill
              uri: http://localhost:8082
              predicates:
                - Path=/api/seckill/**

            - id: order-create
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders
                - Method=POST
            - id: cart-checkout
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/cart/checkout
                - Method=POST
            - id: payment-command
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/*/payments,/api/orders/*/help-payments,/api/orders/*/completion,/api/orders/seckill-orders/*/payments,/api/orders/seckill-orders/*/help-payments,/api/orders/seckill-orders/*/completion
                - Method=POST
            - id: order-query
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**
                - Method=GET
            - id: cart-command
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/cart/**
                - Method=POST,PUT,DELETE
            - id: order-command
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**
                - Method=POST,PUT,DELETE
            - id: order
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**

            - id: product-openapi
              uri: http://localhost:8081
              predicates:
                - Path=/v3/api-docs/product
              filters:
                - RewritePath=/v3/api-docs/product,/v3/api-docs
            - id: seckill-openapi
              uri: http://localhost:8082
              predicates:
                - Path=/v3/api-docs/seckill
              filters:
                - RewritePath=/v3/api-docs/seckill,/v3/api-docs
            - id: order-openapi
              uri: http://localhost:8083
              predicates:
                - Path=/v3/api-docs/order
              filters:
                - RewritePath=/v3/api-docs/order,/v3/api-docs
            - id: user-openapi
              uri: http://localhost:8084
              predicates:
                - Path=/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user,/v3/api-docs

mall:
  jwt:
    secret: mall-local-dev-secret-change-me
  gateway:
    internal-secret: ${MALL_GATEWAY_INTERNAL_SECRET:mall-local-gateway-internal-secret}
    access-audit:
      enabled: ${MALL_GATEWAY_ACCESS_AUDIT_ENABLED:true}
    rate-limit:
      enabled: ${SENTINEL_ENABLED:true}
      require-rules: ${SENTINEL_REQUIRE_RULES:true}
      trusted-proxies: ${MALL_GATEWAY_TRUSTED_PROXIES:}
      required-gateway-resources:
        - api-all
        - auth-login
        - auth-register
        - user
        - audit-query
        - catalog-read
        - product-admin
        - product
        - seckill-reserve
        - seckill-query
        - seckill-admin
        - seckill-internal
        - seckill
        - order-create
        - cart-checkout
        - payment-command
        - order-query
        - cart-command
        - order-command
        - order
      user-limited-routes:
        - audit-query
        - product-admin
        - seckill-reserve
        - seckill-admin
        - seckill-internal
        - order-create
        - cart-checkout
        - payment-command
        - cart-command
        - order-command

springdoc:
  swagger-ui:
    urls:
      - name: product
        url: /v3/api-docs/product
      - name: seckill
        url: /v3/api-docs/seckill
      - name: order
        url: /v3/api-docs/order
      - name: user
        url: /v3/api-docs/user

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,rateLimitRules,redis
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,sentinel
