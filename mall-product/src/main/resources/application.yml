server:
  port: 8081

spring:
  application:
    name: mall-product
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
