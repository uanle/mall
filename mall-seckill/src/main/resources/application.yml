server:
  port: 8082

spring:
  application:
    name: mall-seckill
  config:
    import: classpath:mall-observability.yml
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root
  rabbitmq:
    host: localhost
    port: 5672
    username: mall
    password: mall
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
