server:
  port: 8084

spring:
  application:
    name: mall-user
  config:
    import: classpath:mall-observability.yml
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password: root

mall:
  gateway:
    internal-secret: ${MALL_GATEWAY_INTERNAL_SECRET:mall-local-gateway-internal-secret}
  jwt:
    secret: mall-local-dev-secret-change-me
    ttl-seconds: 7200
  user-cache:
    ttl-seconds: 1800

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
